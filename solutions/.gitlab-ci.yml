# Module 10 bonus: same pipeline on GitLab. In your repo this file lives at the repo root.
# The image tag MUST match the @playwright/test version in package.json.
playwright:
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  stage: test
  parallel: 2
  variables:
    CI: "true"
  script:
    - cd solutions/e2e
    - npm ci
    - npm run typecheck
    - npm run test:ci -- --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - solutions/e2e/playwright-report/
      - solutions/e2e/test-results/
