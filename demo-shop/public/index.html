<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Shop — Login</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <section class="card" style="max-width: 420px; margin: 40px auto;">
      <h1>Demo Shop</h1>
      <p class="info" id="redirect-info" hidden>You must log in to access this page.</p>
      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="user-name">Username</label>
          <input id="user-name" name="username" data-testid="username" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" data-testid="password" autocomplete="current-password">
        </div>
        <div class="alert" role="alert" data-testid="login-error" hidden>
          <span id="login-error-text"></span>
          <button type="button" aria-label="Close error" id="close-error">✕</button>
        </div>
        <button id="login-button" class="primary" type="submit">Login</button>
      </form>
      <details style="margin-top: 20px;">
        <summary>Test accounts</summary>
        <p>Password for all: <code>secret_sauce</code></p>
        <ul>
          <li><code>standard_user</code> — normal user</li>
          <li><code>locked_user</code> — cannot log in</li>
          <li><code>slow_user</code> — every API call takes 3s</li>
        </ul>
      </details>
    </section>
  </main>
  <script src="/app.js"></script>
  <script>
    const form = document.getElementById('login-form')
    const errorBox = document.querySelector('[data-testid="login-error"]')
    const errorText = document.getElementById('login-error-text')
    const button = document.getElementById('login-button')

    if (new URLSearchParams(location.search).has('redirected')) {
      document.getElementById('redirect-info').hidden = false
    }

    document.getElementById('close-error').addEventListener('click', () => (errorBox.hidden = true))

    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      errorBox.hidden = true
      const username = form.username.value.trim()
      const password = form.password.value
      if (!username) return showError('Username is required')
      if (!password) return showError('Password is required')

      button.disabled = true
      button.textContent = 'Logging in…'
      try {
        await api('/api/login', { method: 'POST', body: { username, password } })
        location.href = '/inventory.html'
      } catch (err) {
        showError(err.message)
      } finally {
        button.disabled = false
        button.textContent = 'Login'
      }
    })

    function showError(message) {
      errorText.textContent = message
      errorBox.hidden = false
    }
  </script>
</body>
</html>
